name: e2e

# 浏览器验收舱：真实 chromium 跑视觉回归 + axe 无障碍扫描。
# 视觉基线对 OS/字体敏感（基线在 Windows 生成）——CI 首次对比若因 Linux 字体渲染
# 差异失败，在 CI 同构环境重生成基线后提交（见 docs/testing.md「基线更新流程」）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # 浏览器二进制缓存：restore-keys 兜底——bun.lock 周更（dependabot）不该让 100MB+ 周周重下，
      # 旧缓存恢复后 `playwright install` 会按需补差
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-
      # 文档站静态产物 = 被测对象（设计资产改坏会在这里炸）
      - run: cd site && bun install && bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - name: 上传 Playwright 报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: 上传测试产物（失败时）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7
