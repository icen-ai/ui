name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 快闸门：类型 + 纪律守卫 + 测试（含覆盖率棘轮）。本地 bun run verify 的前半。
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 仅 PR 需要历史（changelog-linkage 的 merge-base）；push main 浅克隆
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx tsc --noEmit
      - run: bun run guard
      - run: bun run test:coverage   # bun test + lcov 覆盖率地板（docs/contracts/coverage-floor.json）
      # 契约快照含破坏性条目 ⇒ CHANGELOG 必须同 PR 改动
      - if: github.event_name == 'pull_request'
        run: bun scripts/changelog-linkage.ts origin/${{ github.base_ref }}

  # 产物门：构建 + 体积预算 + 包面检查（publint/attw 较慢，与 core 并行省墙钟）
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - run: bun run size
      - run: bun run check:pkg

  # 文档站构建冒烟（设计资产改坏会在这里炸）
  site-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: cd site && bun install && bun run build

  # 封装 peer 版本矩阵：react>=18 / vue>=3.3 的 peer 声明在此兑现，
  # 契约测试在每条版本线上实跑（CI 工作区是临时的，改 package.json/bun.lock 无所谓）
  wrapper-compat-react:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ['18', '19']
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # 覆盖安装矩阵线；@types 必须同线（react 18 配 @types/react@18），避免类型错位
      - run: bun add -d react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ matrix.react }} @types/react-dom@${{ matrix.react }}
      - run: bun test tests/unit/react-wrapper.test.tsx

  wrapper-compat-vue:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vue: ['3.3', '3.5']
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun add -d vue@${{ matrix.vue }}
      - run: bun test tests/unit/vue-wrapper.test.ts
