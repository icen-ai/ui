name: 功能请求
description: 新组件、新行为、现有 API 的增强
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你遇到的场景与痛点，而不是直接要某个 API——我们常能找到更贴合库心智模型的解法。
      placeholder: "例如：在 datatable 的汇总行里需要按列配置聚合方式……"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案（可选）
      description: 你设想的 API / DOM 契约 / 事件形态。没有也可以，维护者会提方案一起过。

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 现在怎么绕过去的？为什么不够用？

  - type: dropdown
    id: pr
    attributes:
      label: 是否愿意提交 PR
      description: 我们欢迎实现 PR；加组件的完整仪式见 CONTRIBUTING.md
      options:
        - 愿意（我来实现）
        - 愿意（需要维护者先确认方案）
        - 不愿意，只提需求
    validations:
      required: true
